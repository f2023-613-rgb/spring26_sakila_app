name: Deployment Pipeline

on:
  # Trigger 1: Runs after CI Pipeline completes on main
  workflow_run:
    workflows: ["CI Pipeline"] 
    types:
      - completed
    branches:
      - main
  # Trigger 2: Runs on push to main with specific path filters
  push:
    branches:
      - main
    paths:
      - 'app.py'
      - 'config.py'
      - 'templates/**'
      - 'static/**'
      - 'Dockerfile'
      - 'requirements.txt'
      - 'docker-compose.yml'

jobs:
  deploy-staging:
    name: Deploy to Staging
    # Only run if it's a direct push, or if the CI pipeline actually succeeded
    if: ${{ github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: staging
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Simulate Staging Deployment & Print Env Vars
        run: |
          echo "==== Deploying to Staging ===="
          echo "Current SHA: $GITHUB_SHA"
          echo "Printing all environment variables:"
          env
          echo "Simulating Docker run..."
          echo "docker run -d -p 8080:5000 myapp:staging"

      - name: Output Deployment Summary
        run: |
          echo "### 🚀 Staging Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** Staging" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit SHA:** \`$GITHUB_SHA\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** Successfully Deployed" >> $GITHUB_STEP_SUMMARY

      - name: Slack Notification
        run: echo "Slack notification: Deployment to staging successful"

  deploy-production:
    name: Deploy to Production
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write # Crucial: Allows the bot to create a GitHub Release
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Simulate Production Deployment
        run: |
          echo "==== Deploying to Production ===="
          echo "Simulating Docker run..."
          echo "docker run -d -p 80:5000 myapp:production"

      - name: Generate Version Tag
        id: version
        run: |
          # Creates a tag like v2026.04.25-1
          DATE_TAG=$(date +'%Y.%m.%d')
          echo "TAG_NAME=v${DATE_TAG}-${GITHUB_RUN_NUMBER}" >> $GITHUB_ENV

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ env.TAG_NAME }} \
            --title "Release ${{ env.TAG_NAME }}" \
            --notes "Production deployment triggered by CI/CD pipeline from commit $GITHUB_SHA."

      - name: Slack Notification
        run: echo "Slack notification: Deployment to production successful"
